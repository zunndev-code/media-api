<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Daftar — Ziplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=81">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="logo" href="/">
      <img class="auth-logo" src="/img/logo.png?v=81" alt="Ziplan">
    </a>
    <h1 data-i18n="register.title">Create account</h1>
    <p class="sub">Langung dapat 1000 credit gratis</p>

    <div class="oauth-row">
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24"><path fill="#ea4335" d="M12 5.04c1.62 0 3.06.56 4.2 1.66l3.14-3.14C17.45 1.79 14.97.75 12 .75 7.62.75 3.8 3.28 1.84 6.97l3.66 2.84C6.5 7.1 9 5.04 12 5.04z"/><path fill="#4285f4" d="M23.25 12.27c0-.93-.08-1.6-.26-2.3H12v4.34h6.44c-.13 1.1-.83 2.75-2.39 3.86l3.58 2.78c2.14-1.98 3.62-4.9 3.62-8.68z"/><path fill="#fbbe05" d="M5.5 14.19a7.3 7.3 0 0 1-.4-2.19c0-.77.14-1.5.39-2.19l-3.65-2.84a11.9 11.9 0 0 0-1.09 5.03c0 1.82.4 3.54 1.1 5.03l3.65-2.84z"/><path fill="#34a853" d="M12 23.25c3.1 0 5.7-1.02 7.6-2.78l-3.58-2.78c-.95.66-2.23 1.13-4.02 1.13-3 0-5.5-2.06-6.5-4.63L1.84 17c1.96 3.69 5.78 6.25 10.16 6.25z"/></svg>
        Google
        <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
      </button>
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.87 10.9c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
        GitHub
        <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
      </button>
    </div>

    <div class="divider">atau pakai email</div>

    <form id="reg-form">
      <div class="field">
        <label for="name" data-i18n="register.name">Name</label>
        <input type="text" id="name" placeholder="Nama kamu" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" placeholder="kamu@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
      </div>
      <button class="btn-primary" id="btn-submit" type="submit" data-i18n="register.submit">Create account</button>
    </form>
    <div id="msg"></div>

    <div id="verify-box" class="hidden">
      <h3 data-i18n="reg.verifyTitle">Verifikasi email kamu</h3>
      <p class="auth-sub" data-i18n="reg.verifySub">Kode 6 digit dikirim ke <b id="vemail">-</b></p>
      <div class="field">
        <label for="vcode" data-i18n="reg.code">Kode verifikasi</label>
        <input type="text" id="vcode" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
      </div>
      <button class="btn-primary" id="vbtn" data-i18n="reg.verifyBtn">Verifikasi</button>
      <button class="btn-ghost" id="vresend" style="margin-top:.6rem;width:100%" data-i18n="reg.resend">Kirim ulang kode</button>
      <div id="vmsg"></div>
    </div>

    <p class="auth-foot"><span data-i18n="register.foot">Already have an account?</span> <a href="/login" data-i18n="register.login">Log in</a></p>
  </div>

  <script src="/js/i18n.js?v=81"></script>
  <script>
    fetch('/api/me').then(r => { if (r.ok) location.href = '/dashboard'; });
    applyLang();
    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = tr('register.submit') + '...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const body = await res.json();
        if (res.ok) {
          if (body.data && body.data.verified === false) {
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById('verify-box').classList.remove('hidden');
            document.getElementById('vemail').textContent = document.getElementById('email').value;
            msg.innerHTML = '';
          } else {
            location.href = '/dashboard';
          }
        } else {
          msg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Gagal daftar.') + '</div>';
        }
      } catch (err) {
        msg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = tr('register.submit');
      }
    });
    document.getElementById('vbtn').addEventListener('click', async () => {
      const vmsg = document.getElementById('vmsg');
      const code = document.getElementById('vcode').value.trim();
      if (!code) return;
      const btn = document.getElementById('vbtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, code }),
        });
        const body = await res.json();
        if (res.ok) {
          location.href = '/dashboard';
        } else {
          vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Gagal verifikasi.') + '</div>';
        }
      } catch (err) {
        vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    });
    document.getElementById('vresend').addEventListener('click', async () => {
      const vmsg = document.getElementById('vmsg');
      const btn = document.getElementById('vresend');
      btn.disabled = true;
      try {
        const res = await fetch('/api/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const body = await res.json();
        vmsg.innerHTML = '<div class="alertbox ' + (res.ok ? 'ok' : 'err') + '" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Kode dikirim ulang.') + '</div>';
      } catch (err) {
        vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    });
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  </script>
</body>
</html>
