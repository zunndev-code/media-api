<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Zunndev API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=24">
  <style>
    body { background: var(--bg); color: var(--text); font-family: var(--font); }
    .admin-top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .admin-top .brand { font-weight: 800; letter-spacing: 0.02em; }
    .admin-top .brand b { color: var(--green-bright); }
    .admin-top button {
      background: transparent; border: 1px solid var(--border-strong); color: var(--muted);
      font-family: inherit; font-size: 0.8rem; padding: 0.45rem 0.9rem; border-radius: 9px; cursor: pointer;
    }
    .admin-top button:hover { color: var(--text); border-color: var(--muted-2); }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.2rem 4rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
    .tabs button {
      background: var(--panel); border: 1px solid var(--border-strong); color: var(--muted);
      font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.55rem 1.1rem; border-radius: 10px; cursor: pointer;
    }
    .tabs button.active { background: var(--green); border-color: var(--green); color: #241505; }
    .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.9rem; margin-bottom: 1.5rem; }
    .ov {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem;
    }
    .ov .n { font-size: 1.5rem; font-weight: 800; color: var(--green-bright); }
    .ov .l { font-size: 0.76rem; color: var(--muted-2); margin-top: 0.2rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.3rem; margin-bottom: 1.2rem; }
    .panel h2 { font-size: 0.95rem; font-weight: 800; margin-bottom: 1rem; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .tbl th { text-align: left; color: var(--muted-2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .tbl td { padding: 0.6rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl-wrap { overflow-x: auto; }
    .tbl .act button { margin-right: 0.4rem; }
    select.role-sel {
      background: var(--bg); border: 1px solid var(--border-strong); color: var(--text); border-radius: 8px;
      font-family: inherit; font-size: 0.8rem; padding: 0.3rem 0.5rem;
    }
    .login-box { max-width: 360px; margin: 12vh auto; text-align: center; }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 1.5rem; }
    .login-box h1 b { color: var(--green-bright); }
    .login-box input {
      width: 100%; box-sizing: border-box; background: var(--panel); border: 1px solid var(--border-strong);
      color: var(--text); border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; font-family: inherit; font-size: 0.95rem;
    }
    .login-box .err { color: var(--error); font-size: 0.8rem; margin-bottom: 0.8rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/js/app.js?v=24"></script>
  <script src="/js/admin.js?v=24"></script>
</body>
</html>
