<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Reset password — Ziplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=95">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="logo" href="/">
      <img class="auth-logo" src="/img/logo.png?v=95" alt="Ziplan">
    </a>
    <h1 data-i18n="reset.title">Set a new password</h1>
    <p class="sub" data-i18n="reset.sub">Enter a new password for your account.</p>

    <div id="msg"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password" data-i18n="reset.newpass">New password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="Minimal 8 karakter" required autocomplete="new-password">
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
            <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <p class="caps-warn" id="caps-warn" hidden data-i18n="login.capslock">Caps Lock is on</p>
      </div>
      <div class="strength" id="strength" hidden>
        <div class="strength-bar"><i id="sbar" class="lvl0"></i></div>
        <p class="strength-lbl" id="slbl"></p>
      </div>
      <ul class="req-list" id="req-list">
        <li id="req8" data-i18n="reg.req8">At least 8 characters</li>
        <li id="reqUpper" data-i18n="reg.reqUpper">Uppercase letter (A-Z)</li>
        <li id="reqNum" data-i18n="reg.reqNum">Number (0-9)</li>
      </ul>
      <button class="btn-primary" id="btn-submit" type="submit" data-i18n="reset.submit">Save new password</button>
    </form>

    <p class="auth-foot" id="back-line"><a href="/login" data-i18n="reset.back">Go to login</a></p>
  </div>

  <script src="/js/i18n.js?v=95"></script>
  <script>
    applyLang();
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    if (!token) {
      document.getElementById('msg').innerHTML = '<div class="alertbox err">' + (tr('reset.invalid') || 'Reset link invalid or expired.') + '</div>';
      document.getElementById('reset-form').classList.add('hidden');
    }

    const $ = (id) => document.getElementById(id);
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    const pw = $('password');
    const toggle = $('pw-toggle');
    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      $('eye-open').hidden = show;
      $('eye-closed').hidden = !show;
      pw.focus();
    });
    pw.addEventListener('keyup', (e) => {
      $('caps-warn').hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
    });

    function strength(p) {
      let s = 0;
      if (p.length >= 8) s++;
      if (p.length >= 12) s++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
      if (/\d/.test(p)) s++;
      if (/[^A-Za-z0-9]/.test(p)) s++;
      return s;
    }
    const LVL = [['lvl0', ''], ['lvl1', 'Weak'], ['lvl2', 'Fair'], ['lvl3', 'Good'], ['lvl4', 'Strong'], ['lvl5', 'Strong']];
    pw.addEventListener('input', () => {
      const s = strength(pw.value);
      const box = $('strength'), bar = $('sbar'), lbl = $('slbl');
      box.hidden = !pw.value;
      if (!pw.value) return;
      bar.className = LVL[s][0];
      lbl.textContent = tr('reg.strength') + ': ' + (tr('reg.st' + s) || LVL[s][1]);
      $('req8').classList.toggle('ok', pw.value.length >= 8);
      $('reqUpper').classList.toggle('ok', /[A-Z]/.test(pw.value));
      $('reqNum').classList.toggle('ok', /\d/.test(pw.value));
    });

    $('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('msg');
      msg.innerHTML = '';
      if (pw.value.length < 8) {
        msg.innerHTML = '<div class="alertbox err">' + (tr('reg.pwShort') || 'Password minimal 8 karakter.') + '</div>';
        return;
      }
      const btn = $('btn-submit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> ' + tr('reset.submit');
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw.value }),
        });
        const body = await res.json();
        if (res.ok) {
          msg.innerHTML = '<div class="alertbox ok">' + (tr('reset.success') || 'Password updated. You can now log in.') + '</div>';
          $('reset-form').classList.add('hidden');
          $('back-line').innerHTML = '<a href="/login">' + tr('login.submit') + '</a>';
        } else {
          msg.innerHTML = '<div class="alertbox err">' + esc((body.error && body.error.message) || tr('reset.invalid')) + '</div>';
        }
      } catch (err) {
        msg.innerHTML = '<div class="alertbox err">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = tr('reset.submit');
      }
    });
  </script>
</body>
</html>
