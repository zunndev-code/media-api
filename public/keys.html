<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys — Zunndev API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=36">
  <link rel="stylesheet" href="/css/console.css?v=36">
</head>
<body class="console">
  <main class="page" id="page">

    <section class="sec">
      <div class="sech">
        <div>
          <h2 data-i18n="keys.title">API Keys</h2>
          <p class="sub" data-i18n="keys.sub">1 successful request = 1 credit. Never share your key.</p>
        </div>
        <div class="sech-a">
          <input class="inp" id="kname" data-i18n-ph="keys.name" placeholder="key name (optional)">
          <button class="btn solid" id="newkey" data-i18n="keys.create">Create key</button>
        </div>
      </div>
      <div id="keys" class="rows"></div>
    </section>

  </main>

  <div class="modal-bg" id="mbg">
    <div class="modal">
      <h3 data-i18n="keys.delTitle">Delete API key?</h3>
      <p id="mtext"></p>
      <div class="mact">
        <button class="btn" id="mc" data-i18n="common.cancel">Cancel</button>
        <button class="btn danger" id="mk" data-i18n="keys.delete">Delete</button>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js?v=36"></script>
  <script src="/js/app.js?v=36"></script>
  <script src="/js/console.js?v=36"></script>
</body>
</html>
