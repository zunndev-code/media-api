<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Masuk — Ziplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=95">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="logo" href="/">
      <img class="auth-logo" src="/img/logo.png?v=95" alt="Ziplan">
    </a>
    <h1 data-i18n="login.title">Log in</h1>
    <p class="sub" data-i18n="login.sub">Back to your dashboard</p>

    <div id="msg"></div>

    <div id="login-view">
      <div class="oauth-row">
        <button class="oauth-btn" type="button">
          <svg viewBox="0 0 24 24"><path fill="#ea4335" d="M12 5.04c1.62 0 3.06.56 4.2 1.66l3.14-3.14C17.45 1.79 14.97.75 12 .75 7.62.75 3.8 3.28 1.84 6.97l3.66 2.84C6.5 7.1 9 5.04 12 5.04z"/><path fill="#4285f4" d="M23.25 12.27c0-.93-.08-1.6-.26-2.3H12v4.34h6.44c-.13 1.1-.83 2.75-2.39 3.86l3.58 2.78c2.14-1.98 3.62-4.9 3.62-8.68z"/><path fill="#fbbe05" d="M5.5 14.19a7.3 7.3 0 0 1-.4-2.19c0-.77.14-1.5.39-2.19l-3.65-2.84a11.9 11.9 0 0 0-1.09 5.03c0 1.82.4 3.54 1.1 5.03l3.65-2.84z"/><path fill="#34a853" d="M12 23.25c3.1 0 5.7-1.02 7.6-2.78l-3.58-2.78c-.95.66-2.23 1.13-4.02 1.13-3 0-5.5-2.06-6.5-4.63L1.84 17c1.96 3.69 5.78 6.25 10.16 6.25z"/></svg>
          Google
          <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
        </button>
        <button class="oauth-btn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.87 10.9c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
          GitHub
          <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
        </button>
      </div>

      <div class="divider" data-i18n="login.divider">or use email</div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email" data-i18n="login.email">Email</label>
          <input type="email" id="email" placeholder="kamu@email.com" required autocomplete="email" inputmode="email">
          <p class="inp-err" id="email-err" hidden></p>
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password">
              <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="caps-warn" id="caps-warn" hidden data-i18n="login.capslock">Caps Lock is on</p>
        </div>
        <div class="remember-row">
          <label class="check">
            <input type="checkbox" id="remember" checked>
            <span data-i18n="login.remember">Remember me</span>
          </label>
          <button type="button" class="link-btn" id="forgot-link" data-i18n="login.forgot">Forgot password?</button>
        </div>
        <button class="btn-primary" id="btn-submit" type="submit" data-i18n="login.submit">Log in</button>
      </form>
    </div>

    <div id="forgot-view" class="hidden">
      <h3 class="auth-h3" data-i18n="forgot.title">Reset password</h3>
      <p class="auth-sub" data-i18n="forgot.sub">Enter your email and we'll send a reset link.</p>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="femail" data-i18n="forgot.email">Email</label>
          <input type="email" id="femail" placeholder="kamu@email.com" required autocomplete="email" inputmode="email">
          <p class="inp-err" id="femail-err" hidden></p>
        </div>
        <button class="btn-primary" id="fbtn" type="submit" data-i18n="forgot.submit">Send reset link</button>
      </form>
      <button class="btn-ghost" id="forgot-back" style="margin-top:.6rem;width:100%" data-i18n="forgot.back">Back to login</button>
      <div id="fmsg"></div>
    </div>

    <div id="verify-box" class="hidden">
      <h3 class="auth-h3" data-i18n="reg.verifyTitle">Verify your email</h3>
      <p class="auth-sub" data-i18n="reg.verifySub">A 6-digit code was sent to your email.</p>
      <div class="field">
        <label for="vcode" data-i18n="reg.code">Verification code</label>
        <input type="text" id="vcode" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">
      </div>
      <button class="btn-primary" id="vbtn" data-i18n="reg.verifyBtn">Verify</button>
      <button class="btn-ghost" id="vresend" style="margin-top:.6rem;width:100%" data-i18n="reg.resend">Resend code</button>
      <div id="vmsg"></div>
    </div>

    <p class="auth-foot"><span data-i18n="login.foot">No account?</span> <a href="/register" data-i18n="login.register">Register free</a></p>
    <p class="trust-note"><span class="lock-ic">🔒</span> <span data-i18n="login.secure">Your connection is secure and encrypted.</span></p>
  </div>

  <script src="/js/i18n.js?v=95"></script>
  <script>
    fetch('/api/me').then(r => { if (r.ok) location.href = '/dashboard'; });
    applyLang();

    const $ = (id) => document.getElementById(id);
    const loginView = $('login-view'), forgotView = $('forgot-view'), msgEl = $('msg');

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function showMsg(html, ok) { msgEl.innerHTML = '<div class="alertbox ' + (ok ? 'ok' : 'err') + '">' + html + '</div>'; }
    function setInpErr(id, text) { const el = $(id); if (text) { el.textContent = text; el.hidden = false; } else { el.hidden = true; } }

    const pw = $('password');
    const pwToggle = $('pw-toggle');
    pwToggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      $('eye-open').hidden = show;
      $('eye-closed').hidden = !show;
      pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      pw.focus();
    });
    pw.addEventListener('keyup', (e) => {
      $('caps-warn').hidden = !(e.getModifierState && e.getModifierState('CapsLock'));
    });

    function validateEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()); }

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('btn-submit');
      const em = $('email').value, pm = pw.value;
      let bad = false;
      if (!em.trim()) { setInpErr('email-err', tr('login.emailRequired') || 'Email wajib diisi.'); bad = true; }
      else if (!validateEmail(em)) { setInpErr('email-err', tr('login.emailInvalid') || 'Email tidak valid.'); bad = true; }
      else setInpErr('email-err', '');
      if (!pm) { setInpErr('email-err', ''); showMsg(tr('login.passwordRequired') || 'Password wajib diisi.', false); bad = true; }
      if (bad) return;
      msgEl.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> ' + tr('login.submit');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: em, password: pm, remember: $('remember').checked }),
        });
        const body = await res.json();
        if (res.ok) {
          location.href = '/dashboard';
        } else if (body.error && body.error.code === 'email_not_verified') {
          showMsg(esc(body.error.message), false);
          loginView.classList.add('hidden');
          $('verify-box').classList.remove('hidden');
        } else {
          showMsg(esc((body.error && body.error.message) || 'Gagal masuk.'), false);
        }
      } catch (err) {
        showMsg(esc(err.message), false);
      } finally {
        btn.disabled = false;
        btn.textContent = tr('login.submit');
      }
    });

    $('forgot-link').addEventListener('click', () => {
      loginView.classList.add('hidden');
      msgEl.innerHTML = '';
      forgotView.classList.remove('hidden');
    });
    $('forgot-back').addEventListener('click', () => {
      forgotView.classList.add('hidden');
      loginView.classList.remove('hidden');
    });

    $('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const em = $('femail').value;
      if (!validateEmail(em)) { setInpErr('femail-err', tr('login.emailInvalid') || 'Email tidak valid.'); return; }
      setInpErr('femail-err', '');
      const btn = $('fbtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> ' + tr('forgot.submit');
      const fmsg = $('fmsg');
      fmsg.innerHTML = '';
      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: em }),
        });
        const body = await res.json();
        fmsg.innerHTML = '<div class="alertbox ' + (res.ok ? 'ok' : 'err') + '">' + esc((body.error && body.error.message) || tr('forgot.sent') || 'Reset link sent. Check your inbox.') + '</div>';
      } catch (err) {
        fmsg.innerHTML = '<div class="alertbox err">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = tr('forgot.submit');
      }
    });

    $('vbtn').addEventListener('click', async () => {
      const vmsg = $('vmsg');
      const code = $('vcode').value.trim();
      if (!code) return;
      const btn = $('vbtn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, code }),
        });
        const body = await res.json();
        if (res.ok) {
          location.href = '/dashboard';
        } else {
          vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Gagal verifikasi.') + '</div>';
        }
      } catch (err) {
        vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    });
    $('vresend').addEventListener('click', async () => {
      const vmsg = $('vmsg');
      const btn = $('vresend');
      btn.disabled = true;
      try {
        const res = await fetch('/api/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value }),
        });
        const body = await res.json();
        vmsg.innerHTML = '<div class="alertbox ' + (res.ok ? 'ok' : 'err') + '" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Kode dikirim ulang.') + '</div>';
      } catch (err) {
        vmsg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
