<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Zunndev API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=46">
</head>
<body class="auth-page">
  <div class="auth-card">
    <a class="logo" href="/">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </span>
      Zunndev API
    </a>
    <h1 data-i18n="login.title">Log in</h1>
    <p class="sub" data-i18n="login.sub">Back to your dashboard</p>

    <div class="oauth-row">
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24"><path fill="#ea4335" d="M12 5.04c1.62 0 3.06.56 4.2 1.66l3.14-3.14C17.45 1.79 14.97.75 12 .75 7.62.75 3.8 3.28 1.84 6.97l3.66 2.84C6.5 7.1 9 5.04 12 5.04z"/><path fill="#4285f4" d="M23.25 12.27c0-.93-.08-1.6-.26-2.3H12v4.34h6.44c-.13 1.1-.83 2.75-2.39 3.86l3.58 2.78c2.14-1.98 3.62-4.9 3.62-8.68z"/><path fill="#fbbe05" d="M5.5 14.19a7.3 7.3 0 0 1-.4-2.19c0-.77.14-1.5.39-2.19l-3.65-2.84a11.9 11.9 0 0 0-1.09 5.03c0 1.82.4 3.54 1.1 5.03l3.65-2.84z"/><path fill="#34a853" d="M12 23.25c3.1 0 5.7-1.02 7.6-2.78l-3.58-2.78c-.95.66-2.23 1.13-4.02 1.13-3 0-5.5-2.06-6.5-4.63L1.84 17c1.96 3.69 5.78 6.25 10.16 6.25z"/></svg>
        Google
        <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
      </button>
      <button class="oauth-btn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.87 10.9c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
        GitHub
        <span style="font-size:.68rem;color:var(--muted-2)">segera</span>
      </button>
    </div>

    <div class="divider" data-i18n="login.divider">or use email</div>

    <form id="login-form">
      <div class="field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" placeholder="kamu@email.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn-primary" id="btn-submit" type="submit" data-i18n="login.submit">Log in</button>
    </form>
    <div id="msg"></div>

    <p class="auth-foot"><span data-i18n="login.foot">No account?</span> <a href="/register" data-i18n="login.register">Register free</a></p>
  </div>

  <script src="/js/i18n.js?v=46"></script>
  <script>
    fetch('/api/me').then(r => { if (r.ok) location.href = '/dashboard'; });
    applyLang();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = tr('login.submit') + '...';
      msg.innerHTML = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
        });
        const body = await res.json();
        if (res.ok) {
          location.href = '/dashboard';
        } else {
          msg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc((body.error && body.error.message) || 'Failed.') + '</div>';
        }
      } catch (err) {
        msg.innerHTML = '<div class="alertbox err" style="margin-top:1rem">' + esc(err.message) + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = tr('login.submit');
      }
    });
    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  </script>
</body>
</html>
