<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Beli — Ziplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=94">
  <link rel="stylesheet" href="/css/console.css?v=94">
</head>
<body class="console">
  <main class="page" id="page">

    <div class="cur-plan" id="cur-plan" style="display:none">
      <div>
        <div class="lbl" data-i18n="buy.plan">Your plan</div>
        <div class="val" id="cur-name">-</div>
      </div>
      <div class="cred" id="cur-cred"></div>
    </div>

    <div class="pricing" id="pricing"></div>

    <section class="sec" id="orders-wrap" style="display:none">
      <h2 data-i18n="buy.orders">Role Orders</h2>
      <div id="orders-list"></div>
    </section>

    <div class="note" id="pay-note" data-i18n="buy.note">After you click Buy now, a QR code appears — scan it with any e-wallet (GoPay, OVO, DANA, ShopeePay) or mobile banking. Your role activates automatically once payment is detected. QR is valid for 10 minutes.</div>

  </main>

  <script src="/js/i18n.js?v=94"></script>
  <script src="/js/app.js?v=94"></script>
  <script src="/js/console.js?v=94"></script>
</body>
</html>
