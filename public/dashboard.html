<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/img/logo.png">
  <title>Dashboard — Ziplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=93">
  <link rel="stylesheet" href="/css/console.css?v=93">
</head>
<body class="console">
  <main class="page" id="page">

    <header class="head">
      <div>
        <h1><span id="greet-w">Hello</span>, <span class="nm" id="un">-</span>.</h1>
        <p class="headsub">
          <span id="email">-</span>
        </p>
      </div>
      <a class="btn solid" href="/beli" id="go-buy" data-i18n="ov.addCredit">Add credits</a>
    </header>

    <div class="tiles">
      <div class="tile">
        <p class="tl" data-i18n="ov.role">Role</p>
        <p class="tn" id="s-role">—</p>
        <p class="treset" data-i18n="ov.roleSub">Higher role = more credit</p>
      </div>
      <div class="tile">
        <p class="tl" data-i18n="ov.credits">Credit balance</p>
        <p class="tn acc" id="s-credit">—</p>
        <p class="treset" data-i18n="ov.creditsReset">Reset on the 1st of every month</p>
      </div>
      <div class="tile">
        <p class="tl" data-i18n="ov.today">Hits today</p>
        <p class="tn" id="s-today">—</p>
        <p class="treset" data-i18n="ov.todaySub">Today's API calls</p>
      </div>
      <div class="tile">
        <p class="tl" data-i18n="ov.total">Total hits</p>
        <p class="tn plain" id="s-total">—</p>
        <p class="treset" data-i18n="ov.totalSub">All-time API calls</p>
      </div>
      <div class="tile">
        <p class="tl" data-i18n="ov.failed">Failed requests</p>
        <p class="tn err" id="s-fail">—</p>
        <p class="treset" data-i18n="ov.failSub">API calls that failed</p>
      </div>
    </div>

    <section class="sec">
      <div class="sech">
        <h2 data-i18n="ov.usage">Usage — last 7 days</h2>
      </div>
      <div class="mchart" id="mchart"></div>
      <div class="mchart-labels" id="mchart-labels"></div>
    </section>

  </main>

  <script src="/js/i18n.js?v=93"></script>
  <script src="/js/app.js?v=93"></script>
  <script src="/js/console.js?v=93"></script>
</body>
</html>
